name: Test Coverage

on:
   push:
     branches: [main, master, v2]
   pull_request:
   workflow_dispatch:

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.27.1'

    - name: Install dependencies
      run: go mod download

    - name: Build everything (cmd included)
      run: go build ./...

    - name: Run tests with coverage (parallel)
      run: |
        # pb/ is generated protobuf code with no tests; keep it out of the
        # coverage denominator (mirrors the .golangci.yml pb exclusion).
        #
        # cmd/examplecheck and cmd/tip491probe are live-node harnesses: their
        # purpose is to talk to a real node, so they cannot be unit-tested
        # hermetically. They are gated by go build / go vet / golangci-lint and
        # by the live runs recorded in docs/verification.md, and are excluded
        # from the coverage denominator (CODING_STANDARDS.md §6.5).
        pkgs=$(go list ./... | grep -v '/pb/' \
          | grep -v 'cmd/examplecheck$' | grep -v 'cmd/tip491probe$')
        go test -short -coverprofile=coverage.txt -covermode=atomic $pkgs

    # Lint gate. golangci-lint is installed from source rather than via a
    # prebuilt release: the module targets go 1.27.1 and prebuilt binaries
    # lag the toolchain (the 2.5.0 stock binary cannot even parse go1.27
    # export data). v2.14.0 is the pinned, verified-working version — bump
    # it deliberately, together with the Go version.
    - name: Lint (golangci-lint)
      run: |
        go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
        golangci-lint run

    - name: Enforce coverage floor (80%)
      run: |
        total=$(go tool cover -func=coverage.txt | grep '^total:' | awk '{print substr($NF, 1, length($NF)-1)}')
        echo "Total statement coverage: ${total}%"
        awk -v c="$total" 'BEGIN { exit !(c >= 80) }' || {
          echo "::error::Total coverage ${total}% is below the 80% floor (CODING_STANDARDS.md §6.5)"
          exit 1
        }

    # Docs drift gate: re-render docs/errors.md and docs/examples.md from the
    # tron package source (plus the root facade's examples, via -example-pkg .)
    # and byte-compare. Any hand-edit between the go:errors / go:example
    # markers, or an Example function without a marker (or vice versa), fails
    # the build. Fix with:
    #   go run ./cmd/docgen sync-docs -pkg ./tron -example-pkg . -docs ./docs/errors.md -docs ./docs/examples.md
    - name: docgen drift check
      run: go run ./cmd/docgen sync-docs -pkg ./tron -example-pkg . -docs ./docs/errors.md -docs ./docs/examples.md -check

    # Vulnerability gate: fail on any advisory REACHABLE from the module.
    # The Go patch version is pinned above (1.27.1) because the crypto/tls,
    # x509, asn1 and net/textproto advisories are only fixed in the toolchain.
    - name: Install govulncheck
      run: go install golang.org/x/vuln/cmd/govulncheck@latest

    - name: govulncheck
      run: govulncheck ./...

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
