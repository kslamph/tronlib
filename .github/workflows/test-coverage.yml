name: Test Coverage

on:
   push:
     branches: [main, master]
   pull_request:
   workflow_dispatch:

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.25'
    
    - name: Install dependencies
      run: go mod download
    
    - name: Run unit tests with coverage (parallel)
      run: go test -short -coverprofile=unit_coverage.txt -coverpkg=./pkg/... -covermode=atomic ./pkg/...

    - name: Enforce coverage floor (80%)
      run: |
        total=$(go tool cover -func=unit_coverage.txt | grep '^total:' | awk '{print substr($NF, 1, length($NF)-1)}')
        echo "Total statement coverage: ${total}%"
        awk -v c="$total" 'BEGIN { exit !(c >= 80) }' || {
          echo "::error::Total coverage ${total}% is below the 80% floor (CODING_STANDARDS.md §6.5)"
          exit 1
        }

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
