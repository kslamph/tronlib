name: 🐛 Bug report
description: Something in tronlib behaves incorrectly or crashes.
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!
        **Never include private keys, mnemonics, or funded-account addresses.**
        If reproduction needs a key, create a fresh throwaway account on Nile testnet.
        Search open issues first: https://github.com/kslamph/tronlib/issues
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear, concise description of the bug. What did you expect instead?
      placeholder: |
        Calling cli.Token(ctx, addr).Transfer(...) against contract <address> on Nile
        returns token.New: contract.bad_metadata. Expected: the transfer builds.
    validations:
      required: true
  - type: dropdown
    id: package
    attributes:
      label: Which package?
      options:
        - root facade / Client (dial, broadcast, wait, aliases)
        - account (state, staking, delegation, permissions, voting)
        - tx (builders, With* options, signing, broadcast, receipts, cost)
        - contract (ABI-driven calls, deploys)
        - token (TRC-20 handle, decimal-aware amounts)
        - event (log and event decoding)
        - key (signers, mnemonic, message signing)
        - rpc (1:1 gRPC wrapper surface)
        - tron (addresses, SUN amounts, error codes)
        - cmd/ tools (examplecheck, tip491probe, docgen)
        - docs / README
        - other / not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: tronlib version
      description: Output of `go list -m github.com/kslamph/tronlib/v2` (or the commit if building from source).
      placeholder: v2.x.y or commit SHA
    validations:
      required: true
  - type: input
    id: go-version
    attributes:
      label: Go version
      description: Output of `go version`.
      placeholder: go version go1.27.0 darwin/arm64
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: A standalone snippet or test we can run. Link a repo if it's long. Issues without reproduction steps may be closed as needs-info.
      render: go
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Output / logs
      description: Exact error text or logs (the tron.Error Code/Op/Hint lines especially). Redact anything sensitive.
      render: shell
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Node endpoint type (Nile / Shasta / mainnet / private), OS, anything else that might matter.
      placeholder: grpc.nile.trongrid.io:50051, macOS 15, arm64
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues (open and closed) and found no duplicate.
          required: true
        - label: The reproduction contains no private keys, mnemonics, or funded addresses.
          required: true
        - label: I am using a released version, not an old fork.
          required: false
