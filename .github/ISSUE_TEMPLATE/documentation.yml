name: 📚 Documentation issue
description: Docs are wrong, unclear, or missing.
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        Docs issues are a great first contribution — and fixing one is too:
        most fixes are a one-file PR, see [CONTRIBUTING.md](../CONTRIBUTING.md).
        Note: docs/errors.md and docs/examples.md are generated by cmd/docgen —
        fix the source comments, then regenerate (see docs/runbook.md).
  - type: dropdown
    id: location
    attributes:
      label: Where?
      options:
        - README.md
        - llms.txt
        - docs/architecture.md
        - docs/errors.md (generated — fix the source)
        - docs/examples.md (generated — fix the source)
        - docs/verification.md
        - docs/review.md
        - docs/runbook.md
        - package doc comments (pkg.go.dev)
        - cmd/ tools
        - other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What's wrong?
      description: Wrong, outdated, missing, or confusing? Quote the offending line/section if it exists.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested fix
      description: What should it say instead? A rough draft is fine — we'll polish.
    validations:
      required: false
